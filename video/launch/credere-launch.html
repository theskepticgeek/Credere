function stop(){position=current();playing=false;if(source){try{source.stop()}catch{}source=null}playButton.textContent='Play'}
async function play(){if(playing){stop();return}playButton.disabled=true;status.textContent='Preparing the original soundtrack…';try{audio??=new AudioContext();await audio.resume();let buffer=await window.audioBuffer();volume??=audio.createGain();volume.gain.value=soundOn?1:0;volume.connect(audio.destination);if(position>=39.98)position=0;source=audio.createBufferSource();source.buffer=buffer;source.connect(volume);startClock=audio.currentTime-position;source.start(0,position);playing=true;playButton.textContent='Pause';status.textContent='Audio clock synchronized · Drag the scrubber to inspect any frame'}catch(e){status.textContent=e.message}playButton.disabled=false}
playButton.onclick=play;scrubber.oninput=()=>{let was=playing;if(was)stop();position=Number(scrubber.value);render(position);if(was)play()};sound.onclick=()=>{soundOn=!soundOn;if(volume)volume.gain.value=soundOn?1:0;sound.textContent=soundOn?'Sound on':'Sound off';sound.setAttribute('aria-pressed',String(soundOn))};
function tick(){let t=current();if(playing&&t>=40)stop();scrubber.value=String(t);clock.textContent=`00:${t.toFixed(2).padStart(5,'0')} / 00:40.00`;if(playing)render(t);requestAnimationFrame(tick)}
window.ready=(async()=>{await Promise.all(['Anton','Syne','Manrope','Mono'].map(f=>document.fonts.load(`700 80px ${f}`)));await document.fonts.ready;render(0);tick();return true})();
if(new URLSearchParams(location.search).has('export'))document.documentElement.classList.add('export');
